# ═══════════════════════════════════════════════════════════════════════════
#                   NOT APPLIED. NOT IN THE KUSTOMIZATION.
#
# This file exists to show the SHAPE of the Secret the manifests expect. It is
# never applied, and it holds no values — the deployments refer to
# `feedbackhub-secrets` by name and never to its contents, which is what makes
# every method of supplying it interchangeable.
#
# ── Locally ────────────────────────────────────────────────────────────────
#
#     ./scripts/deploy-k8s.sh          # creates the Secret, then applies
#
# or by hand:
#
#     kubectl create namespace feedbackhub
#     kubectl -n feedbackhub create secret generic feedbackhub-secrets \
#       --from-literal=DB_PASSWORD=feedbackhub \
#       --from-literal=DB_ROOT_PASSWORD=feedbackhub-root \
#       --from-literal=KEYCLOAK_ADMIN_PASSWORD=admin
#     kubectl apply -k .
#
# ── For real ───────────────────────────────────────────────────────────────
#
# Nothing above changes except where the values come from. Pick one:
#
#   External Secrets Operator — the values live in AWS Secrets Manager, Vault,
#   GCP Secret Manager, and an ExternalSecret materialises them:
#
#     apiVersion: external-secrets.io/v1
#     kind: ExternalSecret
#     metadata: { name: feedbackhub-secrets }
#     spec:
#       secretStoreRef: { name: aws-secrets, kind: ClusterSecretStore }
#       target: { name: feedbackhub-secrets }
#       data:
#         - secretKey: DB_PASSWORD
#           remoteRef: { key: prod/feedbackhub, property: db_password }
#
#   Sealed Secrets — an encrypted SealedSecret IS committed; only the
#   controller's private key can decrypt it, so the repository never holds a
#   readable credential:
#
#     kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
#   SOPS with age or KMS — the same idea, encrypted in place, decrypted by the
#   deployment pipeline rather than by a controller.
#
# In all three the Deployments, the Job and the StatefulSet are byte-identical
# to what is in this directory. That is the point: what changes between local
# and a real cluster is values, not structure.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: feedbackhub-secrets
  namespace: feedbackhub
type: Opaque
stringData:
  # The password the API and the migration job connect as.
  DB_PASSWORD: ''
  # Used only to initialise the MySQL container; the application never connects
  # as root.
  DB_ROOT_PASSWORD: ''
  # The Keycloak bootstrap admin. Needed for the admin console and for
  # `npm run auth:google`; the application itself never uses it.
  KEYCLOAK_ADMIN_PASSWORD: ''
