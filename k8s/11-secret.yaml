# ═══════════════════════════════════════════════════════════════════════════
#                    THESE ARE DEVELOPMENT VALUES, NOT SECRETS
#
# The same treatment as keycloak/realm-feedbackhub-development.json, and for
# the same reason: a reviewer applying these manifests should get a working
# system rather than a prompt, and should never have to wonder whether they are
# looking at something that leaked.
#
# `stringData` and not `data`, deliberately. Base64 is not encryption and
# writing it as base64 in a repository is the practice that trains people to
# read a Secret as though it were protected. These are readable because they
# are not protected.
#
# A REAL DEPLOYMENT DOES NOT APPLY THIS FILE. It creates the same three keys
# from a secret manager — Sealed Secrets, External Secrets, SOPS, or the
# platform's own — and the Deployments below are unchanged, because they refer
# to the Secret by name and never to its contents.
#
#     kubectl -n feedbackhub create secret generic feedbackhub-secrets \
#       --from-literal=DB_PASSWORD=... \
#       --from-literal=DB_ROOT_PASSWORD=... \
#       --from-literal=KEYCLOAK_ADMIN_PASSWORD=...
#
# If you do that, remove this file from kustomization.yaml.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: feedbackhub-secrets
  labels:
    app.kubernetes.io/part-of: feedbackhub
type: Opaque
stringData:
  DB_PASSWORD: feedbackhub
  # Used only to initialise the MySQL container. The application connects as
  # DB_USER and never as root.
  DB_ROOT_PASSWORD: feedbackhub-root
  KEYCLOAK_ADMIN_PASSWORD: admin
