# ═══════════════════════════════════════════════════════════════════════════
# Keycloak, running the same development realm this repository imports.
#
# WHAT A PRODUCTION DEPLOYMENT CHANGES, so that nothing here is mistaken for
# one:
#
#   - `start --optimized` instead of `start-dev`, which means TLS, a real
#     hostname, and an explicit build step.
#   - An external database. `start-dev` keeps its data in the container, so
#     this pod loses its realm every time it is rescheduled — which is fine
#     here precisely because the realm is re-imported from a ConfigMap on every
#     start, and is exactly wrong anywhere real.
#   - A realm without a `credentials` block and without fixed user ids. People
#     come from the organisation's directory or are invited.
#
# The realm ConfigMap is generated by kustomize from the file in keycloak/, so
# there is one copy of it in this repository and not two.
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: feedbackhub-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: feedbackhub
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedbackhub-keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: feedbackhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: feedbackhub
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.2
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD

            # The hostname is pinned rather than derived from the Host header.
            #
            # Keycloak will happily mint tokens under whatever host asked for
            # them, which means a realm reached two ways issues two different
            # `iss` values and the API rejects one of them. Pinning it makes
            # the issuer a property of the deployment instead of a property of
            # the request.
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: feedbackhub-config
                  key: AUTH_HOST
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # TLS terminates at the ingress, so this speaks HTTP and trusts the
            # forwarded headers to know what the browser actually used.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # Keycloak's own endpoints, on the management port. `started` is the
          # one that means the realm import finished — /health/ready answers
          # before that, and a pod marked ready with no realm in it sends
          # everybody to a 404.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: realm
          configMap:
            # Generated by kustomize from keycloak/realm-feedbackhub-development.json.
            name: feedbackhub-realm
