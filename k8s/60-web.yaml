# The web tier: the Angular bundle, and the only thing with an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: feedbackhub-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: feedbackhub
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedbackhub-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: feedbackhub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: feedbackhub
    spec:
      securityContext:
        # nginx-unprivileged's own uid. It listens on 8080 precisely so it does
        # not need a capability to bind a privileged port.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: feedbackhub-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Substituted into the nginx config at container start. The only
            # thing this image is told about its surroundings — the realm and
            # the client id are asked for at runtime, from the API.
            - name: API_UPSTREAM
              value: feedbackhub-api:3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The bundle is baked into the image and never written to. These are
          # the only paths nginx needs to write, and they are memory rather
          # than disk: the config it renders at startup, its pid file, and the
          # buffers it uses for proxied responses. With them, the root
          # filesystem above can be read-only.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir:
            medium: Memory
        - name: nginx-cache
          emptyDir:
            medium: Memory
        - name: nginx-run
          emptyDir:
            medium: Memory
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feedbackhub-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: feedbackhub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
