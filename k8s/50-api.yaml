# The API.
#
# IT HAS NO INGRESS, and that is the topology rather than an omission. The
# browser reaches it same-origin through the web tier's nginx, exactly as it
# does behind the CLI dev proxy and in docker-compose. One request path in
# every environment, no CORS anywhere, and nothing outside the cluster can
# address the API at all.
apiVersion: v1
kind: Service
metadata:
  name: feedbackhub-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: feedbackhub
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedbackhub-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: feedbackhub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: feedbackhub
    spec:
      securityContext:
        # The `node` user in the image. Kubernetes refuses to start the pod if
        # the image would run as root, rather than trusting the Dockerfile's
        # USER line to have been written.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # ── The schema this image expects, before it serves a single query ────
      #
      # A Job is not an ordering primitive: nothing makes a Deployment wait for
      # one. So the pod blocks here until the database is at the version this
      # image was built against.
      #
      # THE VERSION, NOT THE TABLE. An earlier draft waited for
      # `schema_migrations` to exist, which is correct exactly once — on a first
      # install. On any later deploy the table is already there, so the API
      # would start against the OLD schema and serve queries for columns that do
      # not exist yet. That failure is silent and data-shaped, which is the
      # worst class to ship.
      #
      # The expected version is derived from the highest migration file in the
      # image rather than written here, so there is no number to keep in step
      # with the migrations directory. A pod stuck in Init is a loud,
      # diagnosable failure; a pod serving a half-migrated schema is not.
      initContainers:
        - name: wait-for-schema
          image: feedbackhub-api:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const fs = require('node:fs');
              const mysql = require('mysql2/promise');
              const wait = (ms) => new Promise((r) => setTimeout(r, ms));

              // What this image ships, read from the image itself.
              const expected = Math.max(
                ...fs
                  .readdirSync('src/db/migrations')
                  .filter((f) => f.includes('.do.'))
                  .map((f) => Number.parseInt(f, 10))
                  .filter(Number.isFinite),
              );

              (async () => {
                for (;;) {
                  try {
                    const c = await mysql.createConnection({
                      host: process.env.DB_HOST,
                      port: Number(process.env.DB_PORT),
                      user: process.env.DB_USER,
                      password: process.env.DB_PASSWORD,
                      database: process.env.DB_NAME,
                    });
                    const [rows] = await c.query(
                      'SELECT MAX(version) AS at FROM schema_migrations',
                    );
                    await c.end();

                    const at = Number(rows[0].at ?? -1);
                    if (at >= expected) {
                      console.log(`schema at ${at}; this image expects ${expected}`);
                      process.exit(0);
                    }
                    console.log(`schema at ${at}; waiting for ${expected}`);
                  } catch (error) {
                    console.log('waiting for the migration job:', error.code ?? error.message);
                  }
                  await wait(3000);
                }
              })();
          envFrom:
            - configMapRef:
                name: feedbackhub-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      containers:
        - name: api
          image: feedbackhub-api:local
          # IfNotPresent so a locally built image is used as-is. A registry
          # deployment sets a digest here and lets the default policy pull it.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # NODE_ENV=production is what makes the boot guard bite: a build with
          # the development identity seam compiled in refuses to start here.
          # That guard is the reason this line is worth reading twice.
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: '3000'
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: feedbackhub-config
          # /health touches nothing but the process. It is deliberately not a
          # database check: a readiness probe that fails when MySQL blinks
          # takes every replica out of service at once and turns a brief
          # database problem into a total outage.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # Must stay above the image's --max-old-space-size, or the heap
              # is allowed to grow past what the cgroup will hand out and the
              # process is killed rather than throwing.
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Nothing in this application writes to disk. Uploads do not exist,
            # logs go to stdout, and the SQL it reads is in the image.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      # Long enough for an in-flight request to finish. src/main.ts closes the
      # server and the connection pool on SIGTERM rather than exiting on it.
      terminationGracePeriodSeconds: 30
---
# With maxUnavailable: 0 on the rollout and two replicas, this is what stops a
# node drain from taking both at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: feedbackhub-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: feedbackhub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
