name: feedbackhub

# ═══════════════════════════════════════════════════════════════════════════
# The whole system: database, identity provider, API, web.
#
#     docker compose up -d --build      everything, built from this repository
#     docker compose up -d mysql keycloak    just the backing services, if you
#                                            are running the apps from a terminal
#
# The migration job runs once and exits, and the API waits for it to succeed —
# so a fresh `up` produces a working board rather than an API talking to an
# empty schema.
#
# WHICH PORT THE BROWSER USES MATTERS, twice over.
#
#   - Keycloak mints tokens whose `iss` is the host the BROWSER asked at, so
#     the published port here and OIDC_ISSUER_URL have to name the same thing.
#   - The API cannot reach that address: `localhost:8080` inside the API's
#     container is the API. It fetches the key set from OIDC_INTERNAL_URL —
#     `keycloak:8080`, the realm's address on this network — while still
#     checking `iss` against the browser-facing issuer. Identity and address
#     are two different things and this is where that stops being pedantry.
# ═══════════════════════════════════════════════════════════════════════════
services:
  mysql:
    image: mysql:8.4.6
    container_name: feedbackhub-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Timestamps are stored and compared in UTC. See notes in the migrations.
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Host port is configurable so a locally installed MySQL on 3306 does not clash.
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "--host=127.0.0.1",
          "--user=root",
          "--password=${DB_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: feedbackhub-keycloak
    restart: unless-stopped
    # start-dev: HTTP without a certificate, and an in-container database. Both
    # are correct for a laptop and neither is correct anywhere else, which is
    # the same line the development identity seam was drawn on.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      # The realm URL is baked into every token's `iss`, so the port the browser
      # uses and the port the API verifies against have to be the same one.
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # Read-only: the container imports this realm, it does not own it. The
      # file in the repository stays the description of what the realm is.
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl and no wget on purpose. This is Keycloak's own
      # documented workaround: bash's /dev/tcp, against the management port.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      mailpit:
        condition: service_started

  # ── Where the realm's email goes — DEVELOPMENT ONLY ──────────────────────
  #
  # Mailpit is not part of this system's architecture. It is here because a
  # laptop has no mail server, and nowhere else. A REAL DEPLOYMENT SUPPLIES
  # REAL SMTP — the organisation's relay, named in the realm's `smtpServer` —
  # and runs no Mailpit at all. Treat this service the way the published
  # development passwords are treated: scaffolding for a reviewer's machine.
  #
  # The realm verifies email addresses, because the API refuses to provision an
  # address nobody has checked — that is how a stranger would get into a
  # domain-restricted board, by registering somebody else's address. Verifying
  # needs somewhere to send the mail, and a laptop has nowhere. Mailpit is that
  # somewhere: it accepts everything on SMTP, delivers nothing, and shows what
  # arrived at http://localhost:8025. Registering an account ends with opening
  # that page and clicking the link.
  #
  # The SMTP port is deliberately not published: only Keycloak sends to it.
  mailpit:
    image: axllent/mailpit:v1.28.0
    container_name: feedbackhub-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # ── The schema, applied once ─────────────────────────────────────────────
  #
  # A one-shot service rather than something the API does on boot. An API that
  # migrates at startup is an API that cannot be run with two replicas without
  # two processes racing to alter the same tables — and it hides a schema
  # change inside a deploy, where a failure reads as "the application will not
  # start" rather than "migration 13 failed".
  #
  # The same image as the API, because the migration scripts and their .sql
  # files ship in it. `npm run seed` is deliberately NOT here: seeding is
  # baseline content, it is idempotent, and it is a decision rather than a
  # consequence of starting the system. Run it once yourself:
  #
  #     docker compose run --rm migrate node scripts/seed.mjs
  migrate:
    build:
      # The repository root: this is an npm workspace and the lockfile is here.
      context: .
      dockerfile: api/Dockerfile
    image: feedbackhub-api:local
    container_name: feedbackhub-migrate
    restart: "no"
    command: ["node", "scripts/migrate.mjs", "up"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: feedbackhub-api:local
    container_name: feedbackhub-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000

      # Inside this network. The published host port is for a human with a
      # terminal, not for a container talking to another container.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

      # The realm's identity: what the browser sees, and therefore what every
      # token says. Compared against `iss` and nothing else.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:${KEYCLOAK_PORT:-8080}/realms/feedbackhub}
      # The realm's address on this network: where the key set is fetched from.
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/feedbackhub
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-feedbackhub-api}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-feedbackhub-web}

      # A fallback only: the browser reaches the API same-origin through the
      # web tier's nginx, so cross-site requests do not arise in this topology.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-4200}}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    # Not published. Nothing outside this network talks to the API directly —
    # the web tier proxies it, which is the same arrangement as in Kubernetes,
    # where the API has no Ingress at all.
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: feedbackhub-web:local
    container_name: feedbackhub-web
    restart: unless-stopped
    environment:
      # Substituted into the nginx config at container start. The web image
      # knows nothing else about its surroundings: the realm and the client id
      # are asked for at runtime from GET /api/auth/config.
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy

# There is deliberately no volume for Keycloak.
#
# Everything the realm is, is in keycloak/realm-feedbackhub-development.json,
# and it is re-imported whenever the container is created. That makes the file
# the only source of truth: a reviewer cannot end up looking at a realm that
# drifted away from what the repository says, and `docker compose down` cannot
# leave a stale one behind. The cost is that anything added through the admin
# console — or by `npm run auth:google` — is gone after a `down`, and re-running
# the script is how it comes back.
#
# A `stop` and `start` is a different thing: the container's own filesystem
# survives, so the realm and its signing keys do, and tokens issued before the
# restart keep working.
volumes:
  mysql-data:
